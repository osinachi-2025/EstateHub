<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login — Celtine Properties</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{url_for('static', filename = '/css/style.css')}}">
</head>
<body>
<div class="page-shell">
<div class="auth-wrap">
  <div class="auth-side">
    <a class="brandmark" href="{{ url_for('home') }}"><div class="mark" style="color:var(--gold);border-color:var(--gold)">C</div><div class="word">Celtine <b>Properties</b></div></a>
    <div><h2 class="h" style="color:var(--sand);max-width:320px">Welcome back. Your saved homes are waiting.</h2></div>
    <div style="font-size:11.5px;color:#8FA79C;font-family:var(--font-mono)">© 2026 Celtine Properties Ltd.</div>
  </div>
  <div class="auth-content">
    <div class="auth-form">
      <h2 class="h">Log in to your account</h2>
      <div class="chip-row" style="margin:16px 0"><span class="chip on">Customer</span><span class="chip">Agent / Poster</span></div>
      <form id="login-form">
      <div class="f-group" style="margin-bottom:14px"><label for="login-email">Email</label><input id="login-email" type="email" name="email" placeholder="you@email.com" required></div>
      <div class="f-group" style="margin-bottom:8px"><label for="login-password">Password</label><input id="login-password" name="password" type="password" placeholder="••••••••" required></div>
      <div style="text-align:right;font-size:12px;color:var(--clay);margin-bottom:18px"><a href="{{ url_for('forgot_password') }}">Forgot password?</a>{% if request.args.get('reset') == 'success' %}<span class="flash-message flash-success" role="status" style="margin-top:10px;text-align:left">Password updated. You can now log in.</span>{% endif %}</div>
      <button class="btn btn-clay" style="width:100%;justify-content:center" type="submit"><span class="btn-label">Log In</span><span class="btn-spinner" hidden aria-hidden="true"></span></button>
      <p id="auth-message" role="alert" style="margin-top:12px;font-size:12px;color:var(--danger)"></p>
      </form>
      <div style="text-align:center;font-size:12.5px;margin-top:16px;color:#5B6660">New to Celtine? <a href="{{ url_for('signup') }}" style="color:var(--clay);font-weight:600">Create an account</a></div>
    </div>
  </div>
</div></div>
<script src="{{url_for('static', filename='js/interactions.js')}}"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const message = document.getElementById('auth-message');
  const submitButton = event.target.querySelector('button[type="submit"]');
  const spinner = submitButton.querySelector('.btn-spinner');
  submitButton.disabled = true;
  submitButton.setAttribute('aria-busy', 'true');
  spinner.hidden = false;
  message.textContent = '';
  try {
    const response = await fetch('{{ url_for("api_login") }}', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(Object.fromEntries(new FormData(event.target)))});
    const data = await response.json();
    if (!response.ok) { message.textContent = data.error || 'Unable to log in.'; return; }
    localStorage.setItem('access_token', data.access_token);
    window.location.href = data.user.role === 'admin' ? '{{ url_for("admindashboard") }}' : data.user.role === 'agent' ? '{{ url_for("posterdashboard") }}' : '{{ url_for("customerdashboard") }}';
  } catch (error) {
    message.textContent = 'Unable to reach the server. Please try again.';
  } finally {
    if (document.visibilityState !== 'hidden') {
      submitButton.disabled = false;
      submitButton.removeAttribute('aria-busy');
      spinner.hidden = true;
    }
  }
});
</script>
</body>
</html>
